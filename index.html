<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07533f" />
  <meta name="description" content="SKEWS Desa Keji - Pantau Risiko Tanah Longsor Desa Keji, Ungaran Barat." />
  <title>SKEWS Desa Keji | Pantau Risiko Tanah Longsor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --green:#075540;
      --green-2:#0b6a51;
      --mint:#c9f7df;
      --mint-2:#eafaf2;
      --lime:#51f0a2;
      --text:#0d1716;
      --muted:#64716f;
      --line:#dce7e2;
      --white:#fff;
      --danger:#f42f3f;
      --blue:#2196f3;
      --shadow:0 12px 35px rgba(0,0,0,.09);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Poppins,Arial,sans-serif;
      color:var(--text);
      background:#f7fbf9;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    a{text-decoration:none;color:inherit}

    /* ===================== HEADER ===================== */
    .header{
      height:72px;
      background:#fff;
      display:flex;
      align-items:center;
      padding:0 60px;
      position:relative;
      z-index:20;
      border-bottom:1px solid rgba(8,75,57,.06);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:270px;
    }
    .brand-mark{
      width:50px;
      height:50px;
      flex:none;
      object-fit:contain;
    }
    .brand-title{
      font-size:25px;
      line-height:1;
      font-weight:800;
      letter-spacing:-.7px;
    }
    .brand-sub{
      margin-top:4px;
      font-size:11.5px;
      line-height:1.12;
      color:#22302e;
      font-weight:500;
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      flex:1;
    }
    .nav a{
      padding:11px 18px;
      border-radius:15px;
      font-size:14px;
      font-weight:500;
      transition:.2s ease;
    }
    .nav a:hover{background:#f1faf5}
    .nav a.active{
      background:#e3f8ee;
      font-weight:700;
    }
    .header-cta{
      min-width:316px;
      display:flex;
      justify-content:flex-end;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      gap:11px;
      background:#0b5a44;
      color:#fff;
      border-radius:15px;
      padding:11px 20px;
      font-size:13px;
      font-weight:600;
      box-shadow:0 5px 12px rgba(8,74,55,.12);
    }
    .cta svg{width:20px;height:20px}

    /* ===================== HERO ===================== */
    .hero{
      position:relative;
      height:443px;
      overflow:hidden;
      background-image:
        linear-gradient(rgba(0,24,20,.34), rgba(0,24,20,.34)),
        url('hero-map.png');
      background-size:cover;
      background-position:center 54%;
      background-attachment:fixed;
      background-repeat:no-repeat;
    }
    .hero-inner{
      position:relative;
      z-index:2;
      height:100%;
      padding:38px 64px 30px;
      display:flex;
      justify-content:space-between;
    }
    .hero-left{width:50%;max-width:690px;color:#fff;position:relative}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:rgba(16,190,125,.24);
      border:1px solid rgba(90,251,174,.52);
      padding:6px 13px;
      border-radius:999px;
      font-size:13px;
      font-weight:600;
      letter-spacing:.05px;
    }
    .eyebrow .dot{
      width:8px;height:8px;border-radius:50%;background:#52f3ab;display:inline-block;
      box-shadow:0 0 0 3px rgba(82,243,171,.16)
    }
    .hero h1{
      margin:13px 0 0;
      font-size:55px;
      line-height:.98;
      letter-spacing:-2px;
      font-weight:800;
    }
    .hero h1 span{display:block;color:#58f0a2}
    .hero h2{
      margin:7px 0 0;
      font-size:24px;
      line-height:1.15;
      font-weight:800;
    }
    .hero-copy{
      margin:18px 0 16px;
      max-width:505px;
      font-size:15px;
      line-height:1.45;
      font-weight:400;
    }
    .hero-actions{display:flex;gap:17px;align-items:center}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      min-height:45px;
      padding:0 24px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      border:1.5px solid transparent;
    }
    .btn-primary{background:#59f0a7;color:#002c20}
    .btn-secondary{background:rgba(2,28,23,.12);border-color:#fff;color:#fff}
    .btn svg{width:18px;height:18px}

    .benefits{
      display:flex;
      gap:24px;
      margin-top:22px;
      align-items:center;
    }
    .benefit{display:flex;align-items:center;gap:10px;color:#fff;min-width:140px}
    .benefit + .benefit{padding-left:23px;border-left:1px solid rgba(255,255,255,.45)}
    .benefit svg{width:29px;height:29px;stroke:#56efaa;stroke-width:2.2;flex:none}
    .benefit b{display:block;font-size:13px;line-height:1.18}
    .benefit small{display:block;font-size:10.5px;line-height:1.2;margin-top:4px;color:rgba(255,255,255,.9)}

    /* handwritten slogan on hero */
    .hero-script{
      position:absolute;
      left:51.2%;
      top:46px;
      width:250px;
      color:#fff;
      font-family:Caveat,cursive;
      font-size:28px;
      line-height:1.02;
      transform:rotate(-3deg);
      text-shadow:0 2px 6px rgba(0,0,0,.22);
    }
    .hero-script small{font-size:24px;display:block;margin-top:2px}
    .hero-script .underline{
      width:170px;height:6px;background:#4df0a0;border-radius:100%;margin-top:13px;transform:rotate(-8deg);display:block;
    }

    /* Hero right-side text/decoration removed; weather/time remains visible. */
    .hero-script,
    .hero-map-label,
    .quote-box,
    .north,
    .scale{
      display:none !important;
    }

    /* weather card */
    .weather{
      position:absolute;
      z-index:5;
      right:41px;
      top:18px;
      bottom:auto;
      width:min(282px,calc(100% - 36px));
      min-height:62px;
      display:flex;
      align-items:center;
      gap:15px;
      padding:10px 14px;
      border:1px solid rgba(255,255,255,.23);
      border-radius:16px;
      background:rgba(20,48,50,.38);
      backdrop-filter:blur(8px);
      color:#fff;
    }
    .weather-icon{font-size:29px;line-height:1}
    .temp{font-size:18px;font-weight:800;line-height:1}
    .weather-place{font-size:9.5px;margin-top:4px;color:#e6efed}
    .weather-divider{width:1px;height:38px;background:rgba(255,255,255,.32);margin-left:auto}
    .date{text-align:left;font-size:10px;line-height:1.42;white-space:nowrap;color:#f0f4f3}
    .date b{font-size:11px}

    .hero-map-label{
      position:absolute;
      z-index:4;
      display:flex;
      align-items:center;
      gap:9px;
      padding:7px 12px 7px 7px;
      background:#fff;
      color:#0d1514;
      border-radius:16px;
      box-shadow:0 5px 18px rgba(0,0,0,.17);
      font-size:12px;
      line-height:1.1;
      font-weight:600;
    }
    .map-label-icon{
      width:31px;height:31px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 4px 8px rgba(0,0,0,.16)
    }
    .map-label-icon.blue{background:#2697ef}
    .map-label-icon.red{background:#f33240}
    .map-label-icon svg{width:20px;height:20px}
    .label-keji{right:35%;top:69%}
    .label-setoyo{right:14.5%;top:32%}

    .north{
      position:absolute;right:19.7%;bottom:20px;z-index:4;color:#fff;text-align:center;font-weight:600;font-size:12px
    }
    .north svg{display:block;width:46px;height:46px;margin:0 auto 2px}
    .scale{
      position:absolute;right:65px;bottom:26px;z-index:4;color:#fff;font-size:11px;text-align:center;white-space:nowrap
    }
    .scale .ticks{display:flex;align-items:end;justify-content:space-between;width:147px;margin-top:5px}
    .scale .line{width:147px;height:4px;border:1.5px solid #fff;border-top:0;display:block}

    .quote-box{
      position:absolute;
      right:41px;
      bottom:66px;
      width:237px;
      padding:14px 17px 15px;
      border-radius:15px;
      background:rgba(47,68,68,.58);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 8px 20px rgba(0,0,0,.1);
      color:#fff;
      font-family:Caveat,cursive;
      font-size:21px;
      line-height:1.02;
      transform:rotate(-1deg);
    }
    .quote-mark{font-family:Arial,sans-serif;font-size:36px;line-height:.6;color:#52efaa;vertical-align:-8px;margin-right:5px;font-weight:800}
    .quote-line{display:block;width:100px;height:5px;border-radius:50px;background:#49ef9e;margin:10px 0 0 auto;transform:rotate(-8deg)}

    /* ===================== SKEWS CONTENT ===================== */
    .content-wrap{
      position:relative;
      z-index:8;
      width:calc(100% - 82px);
      margin:-2px auto 0;
      background:rgba(250,253,252,.97);
      border:1px solid rgba(5,77,60,.08);
      box-shadow:var(--shadow);
      border-radius:21px;
      padding:14px 22px 14px;
    }
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 5px 13px}
    .section-title h3{margin:0;font-size:20px;line-height:1.15;color:#174a3c}
    .section-title p{margin:4px 0 0;color:#707f7b;font-size:11px}
    .map-full{
      display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid #0c5b46;border-radius:999px;background:#fbfffd;color:#0c5b46;font-size:12px;font-weight:700
    }
    .map-full svg{width:17px;height:17px}

    .ews-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .ews-card{
      min-height:224px;
      overflow:hidden;
      border-radius:14px;
      background:#fff;
      display:grid;
      grid-template-columns:69.4% 30.6%;
      border:1.5px solid;
    }
    .ews-card.blue{border-color:#4aa0ec}
    .ews-card.red{border-color:#ec5562}

    .ews-image{
      position:relative;
      min-height:224px;
      background:#224c3e center/cover no-repeat;
      color:#fff;
      overflow:hidden;
    }
    .ews-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,35,31,.73),rgba(8,35,31,.12) 74%,rgba(8,35,31,.03))}
    .ews-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .ews-left-content{position:relative;z-index:2;height:100%;padding:30px 28px 17px}
    .badge-big{
      position:absolute;left:28px;top:27px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff
    }
    .badge-big.blue{background:#2494ef}.badge-big.red{background:#f12f3d}
    .badge-big svg{width:38px;height:38px}
    .ews-name{padding-left:89px;margin-top:5px}
    .ews-name strong{display:block;font-size:25px;line-height:1;font-weight:800}
    .ews-name span{display:block;margin-top:4px;font-size:20px;line-height:1.05;font-weight:700}
    .ews-description{max-width:390px;margin-top:22px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.98)}
    .open-btn{position:absolute;left:28px;bottom:17px;border:0;border-radius:999px;background:#fff;color:#101816;padding:10px 17px 10px 18px;display:inline-flex;align-items:center;gap:13px;font-size:12px;font-weight:700;cursor:pointer}
    .open-btn svg{width:17px;height:17px}

    .stats{
      background:rgba(251,254,253,.97);
      padding:17px 18px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .stat{display:grid;grid-template-columns:31px 1fr;gap:8px;align-items:center}
    .stat-icon{width:29px;height:29px;display:grid;place-items:center;color:#289ad4}
    .stat-icon svg{width:28px;height:28px}
    .stat-status .stat-icon{color:#1ebd7a}
    .red-status .stat-icon{color:#f4ba16}
    .stat-label{font-size:10px;color:#61706d;line-height:1.1}
    .stat-value{font-size:13px;color:#0b1715;font-weight:700;line-height:1.25;margin-top:2px}
    .status-pill{display:flex;align-items:center;gap:10px}
    .status-text b{display:block;font-size:13px}
    .status-green{color:#0e9f66}
    .status-yellow{color:#e3a90b}
    .pending-value{color:#7a8783!important;font-weight:600!important;font-style:italic}
    .pending-status .stat-icon{color:#83908c!important}
    .status-red{color:#df3446!important}
    .stats{gap:7px}

    .quick-grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:1.05fr 1.08fr 1fr 1fr;
      gap:16px;
    }
    .quick{
      min-height:69px;
      border-radius:11px;
      background:#edf5f2;
      display:flex;
      align-items:center;
      gap:17px;
      padding:12px 30px;
    }
    .quick svg{width:35px;height:35px;color:#065b46;stroke-width:1.9;flex:none}
    .quick .quick-logo{width:35px;height:35px;object-fit:contain;flex:none}
    .quick .q-label{font-size:9.5px;color:#6b7b77;line-height:1.2}
    .quick .q-value{font-size:11.7px;font-weight:700;line-height:1.35;color:#21312e;margin-top:2px}
    .quick.report .q-value{display:flex;align-items:center;gap:10px}

    /* ===================== FOOTER ===================== */
    .footer{
      margin-top:14px;
      min-height:78px;
      background:#064738;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 62px;
    }
    .footer-brand{display:flex;align-items:center;gap:10px}
    .footer-mark{width:36px;height:36px;object-fit:contain}
    .footer-title{font-size:12px;font-weight:700;line-height:1.2}
    .footer-title span{display:block;font-size:9px;font-weight:500;margin-top:3px}
    .footer-nav{display:flex;gap:37px;font-size:10.5px}
    .footer-social{display:flex;align-items:center;gap:19px}
    .footer-social svg{width:19px;height:19px}
    .footer-end{display:flex;align-items:center;gap:10px;font-size:9.5px}
    .footer-end svg{width:18px;height:18px}

    /* ===================== MODAL ===================== */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.54);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
    .modal.show{display:flex}
    .modal-card{max-width:520px;width:100%;background:#fff;border-radius:20px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.24)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .modal-head h4{margin:0;color:#0b533f;font-size:22px}
    .close{border:0;background:#eff7f4;border-radius:50%;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
    .modal-card p{color:#5d6b68;line-height:1.65;font-size:13px}
    .modal-data{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
    .data-box{padding:13px;background:#f2f8f5;border-radius:12px}
    .data-box small{display:block;color:#72807d;font-size:10px}
    .data-box b{display:block;margin-top:3px;font-size:15px}

    .modal-card.modal-wide{max-width:1100px;max-height:90vh;overflow:auto}
    .latest-status{
      margin-top:16px;
      padding:13px 15px;
      border-radius:12px;
      background:#f2f8f5;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }
    .latest-status small{display:block;color:#72807d;font-size:10px}
    .latest-status-value{font-size:16px;font-weight:800;color:#7a8783;font-style:italic}
    .history-section{margin-top:20px}
    .history-title{font-size:16px;color:#174a3c;margin:0 0 10px}
    .history-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .chart-box{
      min-height:245px;
      border:1px solid #dfeae6;
      border-radius:14px;
      background:#fbfdfc;
      padding:12px;
    }
    .chart-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:7px;
    }
    .chart-head strong{font-size:12px;color:#24423a}
    .chart-head span{font-size:10px;color:#788581}
    .chart-wrap{height:190px;position:relative}
    .chart-empty{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      color:#7b8884;
      font-size:11px;
      text-align:center;
      padding:20px;
    }
    .status-summary{
      display:grid;
      grid-template-columns:minmax(220px,1fr) minmax(240px,320px);
      gap:14px;
      align-items:stretch;
    }
    .status-chart-box{min-height:280px}
    .status-legend{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }
    .legend-item{
      display:flex;
      align-items:center;
      gap:7px;
      font-size:10px;
      color:#64716f;
    }
    .legend-dot{
      width:9px;height:9px;border-radius:50%;display:inline-block;flex:none
    }
    .legend-normal{background:#57d85a}
    .legend-waspada{background:#f4c430}
    .legend-siaga{background:#f59e0b}
    .legend-bahaya{background:#ef3c4f}

    @media(max-width:920px){
      .modal-card.modal-wide{max-width:calc(100vw - 28px);max-height:88vh}
      .history-grid{grid-template-columns:1fr}
      .status-summary{grid-template-columns:1fr}
    }

    /* ===================== MOBILE ===================== */
    @media(max-width:1180px){
      .header{padding:0 28px}.brand{min-width:225px}.header-cta{min-width:230px}.cta{padding:10px 15px}.nav{gap:6px}
      .hero-inner{padding-left:42px}.hero h1{font-size:49px}.hero-script{left:52%}.label-keji{right:35%;top:68%}
      .content-wrap{width:calc(100% - 42px)}
      .footer{padding:0 35px}.footer-nav{gap:20px}
    }
    @media(max-width:920px){
      .header{height:auto;min-height:72px;padding:12px 22px;flex-wrap:wrap;gap:10px}.brand{min-width:auto}.nav{order:3;width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}.header-cta{display:none}
      .hero{height:500px}.hero-inner{padding:30px 28px}.hero-left{width:65%}.hero h1{font-size:43px}.weather{right:20px;top:18px;bottom:auto}
      .ews-grid{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr 1fr}.footer{flex-wrap:wrap;padding:18px 28px;gap:16px}.footer-nav{order:3;width:100%;justify-content:center}
    }
    @media(max-width:650px){
      .header{padding:10px 16px}.brand-title{font-size:22px}.brand-sub{font-size:10px}.brand-mark{width:44px;height:44px}.nav a{padding:9px 13px;font-size:12px}
      .hero{height:615px;background-position:58% center;background-attachment:fixed;background-size:cover}.hero-inner{padding:24px 18px}.hero-left{width:100%;max-width:none}.eyebrow{font-size:11px}.hero h1{font-size:38px;letter-spacing:-1.1px}.hero h2{font-size:20px}.hero-copy{font-size:13px;max-width:345px}.benefits{gap:12px;flex-wrap:wrap}.benefit{min-width:120px}.benefit + .benefit{padding-left:12px}
      .weather{top:18px;right:18px;bottom:auto;width:calc(100% - 36px)}
      .content-wrap{width:calc(100% - 18px);padding:13px 11px}.section-head{align-items:flex-start}.section-title h3{font-size:18px}.section-title p{font-size:10px}.map-full{font-size:10px;padding:8px 12px}
      .ews-card{grid-template-columns:1fr;min-height:auto}.ews-image{min-height:255px}.stats{min-height:245px}.quick-grid{grid-template-columns:1fr}.quick{padding:12px 20px}.footer{padding:20px 18px;justify-content:center}.footer-nav,.footer-social{display:none}.footer-end{width:100%;justify-content:center}
      .modal-data{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand">
      <img class="brand-mark" src="logo-skews.png" alt="Logo SKEWS" />
      <div>
        <div class="brand-title">SKEWS</div>
        <div class="brand-sub">Desa Keji<br/>Ungaran Barat</div>
      </div>
    </div>

    <nav class="nav" aria-label="Navigasi utama">
      <a class="active" href="#beranda">Beranda</a>
      <a href="#tentang">Tentang</a>
      <a href="#ews">SKEWS</a>
