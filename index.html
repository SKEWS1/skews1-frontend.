<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKEWS Dashboard - Monitoring Longsor</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 300px; width: 100%; border-radius: 8px; }
        .map-controls { position: absolute; top: 10px; right: 10px; z-index: 1000; }
    </style>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">⚠️ Dashboard SKEWS (IoT ESP32)</h1>
            <span id="systemStatus" class="px-3 py-1 text-sm font-semibold rounded-full bg-green-100 text-green-700">AMAN</span>
        </header>

        <!-- Grid Container -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Card Sensor / Grafik -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 mb-3">📊 Status Sensor Terkini</h2>
                <div class="space-y-3">
                    <div id="card-soil" class="p-3 rounded border transition-all">
                        <p class="text-sm font-medium text-gray-600">Kelembaban Tanah</p>
                        <p id="val-soil" class="text-lg font-bold">-- %</p>
                    </div>
                    <div id="card-tilt" class="p-3 rounded border transition-all">
                        <p class="text-sm font-medium text-gray-600">Kemiringan (Tilt)</p>
                        <p id="val-tilt" class="text-lg font-bold">-- °</p>
                    </div>
                    <div id="card-geser" class="p-3 rounded border transition-all">
                        <p class="text-sm font-medium text-gray-600">Pergeseran GPS</p>
                        <p id="val-geser" class="text-lg font-bold">-- cm</p>
                    </div>
                </div>
            </div>

            <!-- Card Peta GPS -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 mb-3">📍 Peta Lokasi Alat (GPS)</h2>
                <div id="map" class="relative">
                    <div class="map-controls flex flex-col gap-2">
                        <button onclick="recenterMap()" class="bg-white p-2 rounded shadow hover:bg-gray-100 text-sm font-bold" title="Tengahkan Peta">
                            🎯
                        </button>
                        <a id="gmapsLink" href="#" target="_blank" class="bg-white p-2 rounded shadow hover:bg-gray-100 text-sm" title="Buka di Google Maps">
                            🗺️
                        </a>
                    </div>
                </div>
                <p id="coordsText" class="mt-2 text-xs text-gray-500 font-mono"></p>
            </div>

        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Koordinat Alat (Bisa diubah sesuai data dari Supabase/ESP32)
        const lat = -7.039611;
        const lng = 110.317389;
        
        // Inisialisasi Peta
        const map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const marker = L.marker([lat, lng]).addTo(map).bindPopup('<b>Lokasi Alat SKEWS</b>').openPopup();
        
        // Set Link Google Maps & Teks Koordinat
        document.getElementById('gmapsLink').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        document.getElementById('coordsText').innerText = `Koordinat: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

        // Fungsi Tombol Re-center Peta
        function recenterMap() {
            map.setView([lat, lng], 16);
        }

        // Fungsi Update Warna Card Berdasarkan Status
        function updateSensorCardStyle(elementId, status) {
            const el = document.getElementById(elementId);
            el.className = "p-3 rounded border transition-all "; // reset class
            
            if (status === 'AMAN') {
                el.classList.add('bg-green-50', 'border-green-300', 'border-l-4', 'border-l-green-500');
            } else if (status === 'SIAGA') {
                el.classList.add('bg-yellow-50', 'border-yellow-300', 'border-l-4', 'border-l-yellow-500');
            } else if (status === 'BAHAYA') {
                el.classList.add('bg-red-50', 'border-red-300', 'border-l-4', 'border-l-red-500');
            } else {
                el.classList.add('bg-gray-50', 'border-gray-200');
            }
        }

        // Contoh simulasi penerapan status awal
        updateSensorCardStyle('card-soil', 'AMAN');
        updateSensorCardStyle('card-tilt', 'AMAN');
        updateSensorCardStyle('card-geser', 'AMAN');
    </script>
</body>
</html>
