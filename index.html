<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKEWS - Command Center</title>
  
  <!-- Library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet GIS (Peta Interaktif - Tanpa Daftar Akun) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { background: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glow-box { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-card-red { border-left: 4px solid #ef4444; background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(15, 23, 42, 0.4) 100%); }
    #map { height: 320px; width: 100%; border-radius: 12px; z-index: 10; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header Section -->
  <header class="glow-box rounded-2xl p-6 mb-8 border border-slate-800">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400">
      SKEWS (Smart Keji Early Warning System)
    </h1>
    <p class="text-slate-400 text-sm">Sistem Peringatan Dini & Pemantauan tanah longsor</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- Panel Kiri -->
    <div class="lg:col-span-4 space-y-6">
      <!-- Indikator Merah -->
      <div class="glow-box glow-card-red p-5 rounded-xl">
        <span class="text-xs text-slate-400 uppercase tracking-wider">Kemiringan Tanah</span>
        <div class="text-3xl font-bold text-red-500 mt-1" id="val-kemiringan">0.0°</div>
      </div>
      
      <!-- Peta -->
      <div class="glow-box p-6 rounded-2xl">
        <h2 class="text-sm text-slate-300 mb-4">Peta Lokasi Interaktif</h2>
        <div id="map"></div>
      </div>
    </div>

    <!-- Panel Kanan (Grafik) -->
    <div class="lg:col-span-8 glow-box p-6 rounded-2xl">
        <h2 class="text-sm text-slate-300 mb-4">Grafik Tren Sensor</h2>
        <div class="relative h-[320px]">
            <canvas id="sensorChart"></canvas>
        </div>
    </div>
  </div>

  <script>
    // Inisialisasi Peta
    const map = L.map('map').setView([-7.120583, 110.379528], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors & CARTO'
    }).addTo(map);

    const marker = L.marker([-7.120583, 110.379528]).addTo(map)
      .bindPopup('<b>Stasiun SKEWS</b>');

    // Inisialisasi Chart
    const ctx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Kemiringan (°)', data: [], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#64748b' } } } }
    });

    // Update Data
    async function updateData() {
      try {
        const res = await fetch('https://skews1-backend.vercel.app/api/data');
        const data = await res.json();
        if (!data || data.length === 0) return;

        const latest = data[0];
        document.getElementById('val-kemiringan').innerText = `${latest.kemiringan_tanah}°`;

        const reversed = [...data].reverse();
        sensorChart.data.labels = reversed.map(d => new Date(d.created_at).toLocaleTimeString());
        sensorChart.data.datasets[0].data = reversed.map(d => d.kemiringan_tanah);
        sensorChart.update();

        if (latest.latitude && latest.longitude) {
          const newLatLng = [parseFloat(latest.latitude), parseFloat(latest.longitude)];
          marker.setLatLng(newLatLng);
          map.panTo(newLatLng);
        }
      } catch (e) { console.error(e); }
    }
    
    updateData();
    setInterval(updateData, 5000);
  </script>
</body>
</html>
