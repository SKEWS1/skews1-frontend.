<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peta Lokasi SKEWS Desa Keji</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .top-panel {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-box {
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .title-box strong {
      display: block;
      color: #075540;
      font-size: 16px;
    }

    .title-box span {
      display: block;
      margin-top: 3px;
      color: #66736f;
      font-size: 10px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      background: #075540;
      color: #fff;
      text-decoration: none;

      padding: 10px 16px;
      border-radius: 999px;

      font-size: 11px;
      font-weight: 700;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .legend {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 1000;

      background: rgba(255, 255, 255, 0.96);
      padding: 12px 15px;
      border-radius: 14px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);

      font-size: 10px;
      color: #45534f;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .blue {
      background: #2494ef;
    }

    .red {
      background: #f12f3d;
    }

    .leaflet-popup-content {
      font-family: Arial, sans-serif;
    }

    .leaflet-popup-content strong {
      color: #075540;
      font-size: 13px;
    }

    .leaflet-popup-content span {
      display: block;
      margin-top: 5px;
      color: #66736f;
      font-size: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="top-panel">
    <div class="title-box">
      <strong>Peta Lokasi SKEWS</strong>
      <span>Desa Keji, Ungaran Barat</span>
    </div>

    <a href="index.html" class="back-button">
      ← Kembali
    </a>
  </div>

  <div id="map"></div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-dot blue"></span>
      <span>SKEWS 1 — Dusun Keji</span>
    </div>

    <div class="legend-item">
      <span class="legend-dot red"></span>
      <span>SKEWS 2 — Dusun Setoyo</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // KOORDINAT SKEWS
    const skews1 = [-7.1164830, 110.3900140];
    const skews2 = [-7.1294947, 110.3785400];

    // Membuat peta
    const map = L.map("map");

    // Peta dasar OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Icon SKEWS 1
    const iconSkews1 = L.divIcon({
      className: "",
      html: `
        <div style="
          width:30px;
          height:30px;
          background:#2494ef;
          border:3px solid #fff;
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          box-shadow:0 3px 10px rgba(0,0,0,.35);
          position:relative;
        ">
          <div style="
            position:absolute;
            width:8px;
            height:8px;
            background:#fff;
            border-radius:50%;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
          "></div>
        </div>
      `,
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -28]
    });

    // Icon SKEWS 2
    const iconSkews2 = L.divIcon({
      className: "",
      html: `
        <div style="
          width:30px;
          height:30px;
          background:#f12f3d;
          border:3px solid #fff;
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          box-shadow:0 3px 10px rgba(0,0,0,.35);
          position:relative;
        ">
          <div style="
            position:absolute;
            width:8px;
            height:8px;
            background:#fff;
            border-radius:50%;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
          "></div>
        </div>
      `,
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -28]
    });

    // MARKER SKEWS 1
    const marker1 = L.marker(skews1, {
      icon: iconSkews1
    }).addTo(map);

    marker1.bindPopup(`
      <strong>SKEWS 1 — Dusun Keji</strong>
      <span>
        Koordinat:<br>
        -7.1164830, 110.3900140
      </span>
    `);

    // MARKER SKEWS 2
    const marker2 = L.marker(skews2, {
      icon: iconSkews2
    }).addTo(map);

    marker2.bindPopup(`
      <strong>SKEWS 2 — Dusun Setoyo</strong>
      <span>
        Koordinat:<br>
        -7.1294947, 110.3785400
      </span>
    `);

    // Menampilkan KEDUA titik sekaligus
    const bounds = L.latLngBounds([
      skews1,
      skews2
    ]);

    map.fitBounds(bounds, {
      padding: [70, 70]
    });
  </script>

</body>
</html>
